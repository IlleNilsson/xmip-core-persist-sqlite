[package]
name = "xmip-core-persist-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-persist-sqlite"
description = "The management store: an embedded SQLite file, bundled, holding persist's sealed records in one table. A xmip-core-persist technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent, never the reverse (repository-model.md).
# The Engine trait, the error and the encryption above it live there; this
# crate only keeps bytes under bytes.
persist = { workspace = true }
# The engine the owner chose for the management store (ADR-0015, amendment
# 2026-09-25), the version transport/sqlite and archive/sqlite use. Bundled:
# the SQLite amalgamation is compiled into the crate, so a node needs no SQLite
# installed beside it. SQLCipher is not used: the layer above is the one way
# (ADR-0063 clause 2).
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
# The checks every engine passes, run from persist's `fixture` module, sealing
# under a key-encryption key held in memory rather than the machine's own key
# store; the feature is enabled here so it is never part of a production build.
persist = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
